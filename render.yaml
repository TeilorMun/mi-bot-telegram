services:
  - type: web
    name: mi-bot-telegram
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMINS
        value: "740151755"
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPT_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
